<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google tag (gtag.js) --><script async src="https://www.googletagmanager.com/gtag/js?id=G-GW7CWB490F"></script><script>window.dataLayer = window.dataLayer || [];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', 'G-GW7CWB490F');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Data OS - Slide: Problem Definition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0E27;
            --accent: #FF3333;
            --neon: #FF3333;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B9C1;
            --transition: all 0.5s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at 100% 0%, #1a0a0a 0%, var(--bg) 60%);
        }

        .slide-content {
            width: 100%;
            max-width: 1200px;
            padding: 60px;
            position: relative;
        }

        header { margin-bottom: 60px; }
        .label {
            font-size: 14px;
            letter-spacing: 0.3em;
            color: var(--neon);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 12px;
            display: block;
        }
        h2 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 60px;
        }

        .problem-box, .legacy-box {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--neon);
            padding: 40px;
            border-radius: 4px 16px 16px 4px;
        }

        .legacy-box { border-left-color: #555; opacity: 0.7; }

        h3 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 24px;
            color: var(--neon);
        }

        .legacy-box h3 { color: #888; }

        ul { list-style: none; }
        li {
            font-size: 20px;
            margin-bottom: 16px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        li::before {
            content: "•";
            color: var(--neon);
            font-weight: bold;
        }
        
        .legacy-box li::before { color: #555; }

        .key-message {
            text-align: center;
            padding: 30px;
            background: rgba(255, 51, 51, 0.05);
            border: 1px dashed rgba(255, 51, 51, 0.2);
            border-radius: 12px;
        }

        .key-message p {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .fade-up { opacity: 0; transform: translateY(30px); animation: fadeUp 0.8s ease-out forwards; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="slide-content">
        <header class="fade-up">
            <span class="label">Business Impact</span>
            <h2>문제 정의 <span style="color:var(--neon);">(Business Impact 중심)</span></h2>
        </header>

        <div class="grid-container">
            <!-- Left: Problem -->
            <div class="problem-box fade-up delay-1">
                <h3>Problem</h3>
                <ul>
                    <li>실적 기준 불일치 → <span style="color:#fff;">조직 내 분쟁 발생</span></li>
                    <li>활동과 성과 연결 <span style="color:#fff;">불명확</span></li>
                    <li>관리자 판단이 <span style="color:#fff;">경험 의존</span></li>
                </ul>
            </div>

            <!-- Right: Legacy -->
            <div class="legacy-box fade-up delay-1">
                <h3>Business Impact</h3>
                <ul>
                    <li>잘못된 우선순위 → 자원 낭비</li>
                    <li>의사결정 지연 → 사업개발 실행 속도 저하</li>
                    <li>성과 해석 불일치 → 조직 운영 비효율 증가</li>
                </ul>
            </div>
        </div>

        <div class="key-message fade-up delay-2">
            <p>"문제는 데이터가 없는 것이 아니라, <span style="color:var(--neon);">의사결정 구조</span>가 없다는 것입니다."</p>
        </div>
    </div>
</body>
</html>
