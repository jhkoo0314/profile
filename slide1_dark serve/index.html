    <style>
        /* ============================================================ */
        /* MASTER SLIDE ENGINE STYLES                                   */
        /* ============================================================ */
        :root {
            --bg-master: #0A0E27;
            --nav-accent: #00D9FF;
            --transition-speed: 0.8s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-master);
            font-family: 'Outfit', sans-serif;
            overflow: hidden; /* Prevent master scroll */
            color: #fff;
            width: 100vw;
            height: 100vh;
        }

        #presentation-deck {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .slide-frame.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: scale(1);
        }

        .slide-frame.past { transform: scale(1.1); opacity: 0; }
        .slide-frame.future { transform: scale(0.9); opacity: 0; }

        /* Master Navigation Controls */
        #nav-controls {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 9999;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .nav-btn:hover { border-color: var(--nav-accent); box-shadow: 0 0 15px var(--nav-accent); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #slide-counter {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--nav-accent);
            margin-right: 15px;
        }

        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--nav-accent);
            width: 0%;
            z-index: 10000;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--nav-accent);
        }

        /* Common Slide Internal Selectors (Scoped to Slide Frame) */
        .slide-frame h1, .slide-frame h2, .slide-frame p, .slide-frame h3 { font-family: 'Outfit', sans-serif; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #nav-controls {
                right: 20px;
                bottom: 20px;
                gap: 10px;
                padding: 10px;
                background: rgba(0,0,0,0.5);
                border-radius: 30px;
                backdrop-filter: blur(10px);
            }
            .nav-btn { width: 40px; height: 40px; }
            #slide-counter { margin-right: 5px; font-size: 11px; }
            #progress-bar { height: 4px; }
        }
    </style>

    <script>
        let currentSlide = 1;
        const totalSlides = 26;

        // Universal Mobile Strategy: Inject responsive styles into iframes at runtime
        const mobileCSS = `
            @media (max-width: 768px) {
                body { overflow-y: auto !important; height: auto !important; padding: 30px 15px !important; display: block !important; }
                .layout-container, .slide-content, .main-concept, .principles-container, .dive-meta, .uplink-container {
                    display: block !important;
                    width: 100% !important;
                    padding: 0 !important;
                    grid-template-columns: 1fr !important;
                    gap: 30px !important;
                }
                .photo-frame { width: 100% !important; height: auto !important; aspect-ratio: 1/1.2 !important; margin-bottom: 20px !important; }
                h1 { font-size: 2.8rem !important; margin-bottom: 1.2rem !important; line-height: 1.1 !important; word-break: keep-all !important; }
                h2 { font-size: 1.8rem !important; line-height: 1.2 !important; margin-bottom: 1rem !important; }
                .description-box, .mission-statement, .sub-text { font-size: 1.05rem !important; line-height: 1.6 !important; }
                .os-cycle li { font-size: 0.95rem !important; padding: 6px 0 6px 25px !important; }
                .principles-container { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
                .visual-stack, .ambient-glow, .bg-decoration, .nav-hint { display: none !important; }
                .protocol-box { width: 100% !important; padding: 15px !important; }
                .protocol-item { font-size: 0.8rem !important; gap: 8px !important; }
                .os-cycle { margin-top: 15px !important; }
            }
        `;

        function injectMobileStyles(iframe) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (!doc) return;
                if (doc.getElementById('mobile-patch-style')) return;

                const style = doc.createElement('style');
                style.id = 'mobile-patch-style';
                style.textContent = mobileCSS;
                doc.head.appendChild(style);
            } catch (e) {
                // Squelch cross-origin errors if any
            }
        }

        function updateUI() {
            // Update Slides
            document.querySelectorAll('.slide-frame').forEach((frame, idx) => {
                const slideNum = idx + 1;
                frame.classList.remove('active', 'past', 'future');
                
                if (slideNum === currentSlide) {
                    frame.classList.add('active');
                    // Ensure active iframe is optimized
                    const iframe = frame.querySelector('iframe');
                    if (iframe) {
                        if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                            injectMobileStyles(iframe);
                        } else {
                            iframe.onload = () => injectMobileStyles(iframe);
                        }
                    }
                } else if (slideNum < currentSlide) {
                    frame.classList.add('past');
                } else {
                    frame.classList.add('future');
                }
            });

            // Update Counter
            document.getElementById('slide-counter').innerText = 
                `${currentSlide.toString().padStart(2, '0')} / ${totalSlides}`;

            // Update Buttons
            document.getElementById('prev-btn').disabled = (currentSlide === 1);
            document.getElementById('next-btn').disabled = (currentSlide === totalSlides);

            // Update Progress Bar
            document.getElementById('progress-bar').style.width = 
                `${(currentSlide / totalSlides) * 100}%`;
        }

        function changeSlide(direction) {
            const next = currentSlide + direction;
            if (next >= 1 && next <= totalSlides) {
                currentSlide = next;
                updateUI();
            }
        }

        // Global Keyboard Listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                changeSlide(1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                changeSlide(-1);
            }
        });

        // Initialize UI
        updateUI();

        // One-time pass for all currently loaded iframes
        window.addEventListener('load', () => {
            document.querySelectorAll('iframe').forEach(iframe => injectMobileStyles(iframe));
        });
    </script>
