<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slide1_dark - PDF Print Bundle</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: #111;
        }

        .deck {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .slide-page {
            width: 16in;
            height: 9in;
            border: 0;
            margin: 0;
            padding: 0;
            page-break-after: always;
            break-after: page;
            overflow: hidden;
            background: #000;
        }

        .slide-page iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .slide-page:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        @page {
            size: 16in 9in;
            margin: 0;
        }

        @media screen {
            body {
                padding: 20px 0;
            }

            .slide-page {
                box-shadow: 0 6px 28px rgba(0, 0, 0, 0.45);
            }
        }

        @media print {
            html, body {
                background: #fff;
            }

            .deck {
                display: block;
            }

            .slide-page {
                box-shadow: none;
            }
        }
    </style>
</head>
