<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Data OS - Appendix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0E27;
            --accent: #555;
            --text-primary: #FFFFFF;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--bg) 100%);
        }

        .appendix-header {
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 60px 100px;
        }

        h1 {
            font-size: 80px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            color: #8892b0;
            letter-spacing: 0.4em;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .fade-in { opacity: 0; animation: fadeIn 1.5s ease-out forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="appendix-header fade-in">
        <h1>Appendix</h1>
        <p>Result Assets & Samples</p>
    </div>
</body>
</html>
