<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Data OS - Print Edition (27-28)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #111827; color: #fff; font-family: 'Outfit', sans-serif; }
    body { padding-bottom: 16px; }
    .print-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 24px;
      background: #0A0E27;
      border-bottom: 2px solid #00D9FF;
    }
    .print-header h1 { font-size: 22px; font-weight: 700; color: #00D9FF; }
    .print-header p { margin-top: 4px; font-size: 13px; color: #94a3b8; }
    .print-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .status-badge {
      min-width: 180px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      font-size: 12px;
      text-align: center;
    }
    .status-badge.ready { background: rgba(0,217,255,0.16); color: #67e8f9; }
    .print-btn, .nav-btn {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      background: #00D9FF;
      color: #0A0E27;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn.alt {
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .print-btn:disabled { opacity: 0.45; cursor: wait; }
    .slide-wrapper { width: 297mm; margin: 0 auto 6px; }
    .slide-label {
      padding: 8px 0;
      text-align: center;
      background: #111426;
      color: #8892b0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .slide-page {
      width: 297mm;
      height: 210mm;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.45);
    }
    .slide-page iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    .slide-page.is-loading::after {
      content: 'Loading slide...';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      letter-spacing: 0.08em;
      background: linear-gradient(180deg, rgba(10,14,39,0.92), rgba(10,14,39,0.96));
    }
    @page { size: A4 landscape; margin: 0; }
    @media print {
      html, body { background: #fff; margin: 0; padding: 0; }
      .print-header, .slide-label, .screen-only { display: none !important; }
      .slide-wrapper { margin: 0; }
      .slide-page {
        margin: 0;
        box-shadow: none;
        width: 297mm;
        height: 210mm;
        page-break-after: always;
        break-after: page;
      }
      .slide-wrapper:last-child .slide-page {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>
<body>
  <div class="print-header screen-only">
    <div>
      <h1>Sales Data OS - Print Edition (27-28)</h1>
      <p>27~28번 전용 인쇄본 · 마지막 두 슬라이드 안정 출력용</p>
    </div>
    <div class="print-actions">
      <a class="nav-btn alt" href="print.html">1-26 메인 열기</a>
      <div class="status-badge" id="print-status">슬라이드 준비 중...</div>
      <button class="print-btn" id="print-btn" disabled>PDF로 인쇄</button>
    </div>
  </div>

    <section class="slide-wrapper" data-slide-number="27">
      <div class="slide-label screen-only">SLIDE 27 / 28 - Report 04</div>
      <div class="slide-page">
        <iframe
          src="slide-27.html"
          id="frame-27"
          title="Slide 27"
          scrolling="no"
          referrerpolicy="no-referrer"
        ></iframe>
      </div>
    </section>
    <section class="slide-wrapper" data-slide-number="28">
      <div class="slide-label screen-only">SLIDE 28 / 28 - RADAR Decision Brief</div>
      <div class="slide-page">
        <iframe
          src="slide-28.html"
          id="frame-28"
          title="Slide 28"
          scrolling="no"
          referrerpolicy="no-referrer"
        ></iframe>
      </div>
    </section>

  <script>
    const ANIMATION_KILL_CSS = [
      'html, body {',
      '  overflow: hidden !important;',
      '  -webkit-print-color-adjust: exact !important;',
      '  print-color-adjust: exact !important;',
      '}',
      '*, *::before, *::after {',
      '  animation: none !important;',
      '  transition: none !important;',
      '  scroll-behavior: auto !important;',
      '}',
      '.fade-up,',
      '.fade-in,',
      '.stagger-up,',
      '.pop-in,',
      '.slide-in,',
      '.slide-in-right,',
      '[class*="fade"],',
      '[class*="slide"],',
      '[class*="appear"],',
      '[class*="reveal"],',
      '[class*="animate"],',
      '[class*="delay-"] {',
      '  opacity: 1 !important;',
      '  visibility: visible !important;',
      '  transform: none !important;',
      '  filter: none !important;',
      '}',
      '.particle,',
      '.ambient-glow,',
      '.glow,',
      '.pulse,',
      '.blink,',
      '.scanner-line,',
      '.scanner,',
      '.orb,',
      '.typing-cursor {',
      '  animation: none !important;',
      '  transition: none !important;',
      '}',
      '.principle-card,',
      '.flow-node,',
      '.detail-card,',
      '.step-card {',
      '  -webkit-backdrop-filter: none !important;',
      '  backdrop-filter: none !important;',
      '}'
    ].join('\n');

    const frames = Array.from(document.querySelectorAll('iframe'));
    const statusEl = document.getElementById('print-status');
    const printBtn = document.getElementById('print-btn');

    function updateStatus() {
      const readyCount = frames.filter((frame) => frame.dataset.ready === 'true').length;
      if (readyCount === frames.length) {
        statusEl.textContent = frames.length + '개 슬라이드 준비 완료';
        statusEl.classList.add('ready');
        printBtn.disabled = false;
      } else {
        statusEl.textContent = '슬라이드 준비 중... ' + readyCount + ' / ' + frames.length;
      }
    }

    function injectKillCss(frame) {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc) return false;
        let style = doc.getElementById('__print_anim_kill__');
        if (!style) {
          style = doc.createElement('style');
          style.id = '__print_anim_kill__';
          (doc.head || doc.documentElement).appendChild(style);
        }
        style.textContent = ANIMATION_KILL_CSS;
        return true;
      } catch (error) {
        return false;
      }
    }

    function frameLooksRendered(frame) {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || doc.readyState !== 'complete') return false;
        const body = doc.body;
        if (!body || body.children.length === 0) return false;
        const canvases = Array.from(doc.querySelectorAll('canvas'));
        if (canvases.length > 0) {
          const canvasReady = canvases.some((canvas) => canvas.width > 0 && canvas.height > 0);
          if (!canvasReady) return false;
        }
        return true;
      } catch (error) {
        return false;
      }
    }

    function markFrameReady(frame) {
      const wrap = frame.closest('.slide-page');
      const ok = injectKillCss(frame);
      if (ok && frameLooksRendered(frame)) {
        frame.dataset.ready = 'true';
        wrap.classList.remove('is-loading');
      }
      updateStatus();
    }

    function forceReloadFrame(frame) {
      const src = frame.getAttribute('src');
      if (!src) return;
      frame.src = src;
    }

    frames.forEach((frame, index) => {
      frame.dataset.ready = 'false';
      const wrap = frame.closest('.slide-page');
      wrap.classList.add('is-loading');

      frame.addEventListener('load', () => {
        setTimeout(() => markFrameReady(frame), 100);
        setTimeout(() => markFrameReady(frame), 400);
        setTimeout(() => markFrameReady(frame), 1200);
        setTimeout(() => markFrameReady(frame), 2400);
      });

      setTimeout(() => forceReloadFrame(frame), index * 40);
    });

    setTimeout(() => frames.forEach(markFrameReady), 2500);
    setTimeout(() => {
      frames.forEach((frame) => {
        if (frame.dataset.ready !== 'true') forceReloadFrame(frame);
      });
    }, 4000);
    setTimeout(() => frames.forEach(markFrameReady), 5200);

    window.addEventListener('beforeprint', () => frames.forEach(markFrameReady));

    printBtn.addEventListener('click', async () => {
      printBtn.disabled = true;
      statusEl.textContent = '인쇄 준비 마무리 중...';
      frames.forEach((frame) => {
        if (frame.dataset.ready !== 'true') forceReloadFrame(frame);
      });
      await new Promise((resolve) => setTimeout(resolve, 1800));
      frames.forEach(markFrameReady);
      await new Promise((resolve) => setTimeout(resolve, 600));
      window.print();
      setTimeout(updateStatus, 500);
    });

    updateStatus();
  </script>
</body>
</html>
