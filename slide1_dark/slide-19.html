<!DOCTYPE html>
<html lang="ko">
<head>
    <script></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Domain Expansion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0E27;
            --accent: #FFB800;
            --text-primary: #FFFFFF;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--bg) 100%);
        }

        .divider-header {
            text-align: center;
            border-top: 1px solid rgba(255,184,0,0.2);
            border-bottom: 1px solid rgba(255,184,0,0.2);
            padding: 60px 100px;
            position: relative;
        }

        .divider-header::before, .divider-header::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }
        .divider-header::before { top: -5px; left: -5px; }
        .divider-header::after { bottom: -5px; right: -5px; }

        h1 {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(180deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: #8892b0;
            letter-spacing: 0.4em;
            margin-top: 24px;
            text-transform: uppercase;
        }

        .tag {
            display: inline-block;
            margin-top: 40px;
            background: rgba(255, 184, 0, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .fade-in { opacity: 0; animation: fadeIn 1.5s ease-out forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="divider-header fade-in">
        <h1>Business Domain Expansion</h1>
        <p>Vertical Expertise: Auction & Property</p>
        <div class="tag">REAL ESTATE DATA ENGINE</div>
    </div>
</body>
</html>
